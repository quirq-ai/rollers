[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqroll"
version = "0.1.0"
description = "Rollers for quirq infra (qq): toolchain pin rolls and lockfile update config."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["qqsync @ git+https://github.com/quirq-ai/sync@8f624f4a7fe3abdab2c7b83376f1ae7772073fd4"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "PyYAML==6.0.3"]

[project.scripts]
qqroll = "qqroll.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
