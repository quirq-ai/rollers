# Hand-written until infra-config generates this repo's presubmit (V0-CFG-02).
# Runs on every PR and in the merge queue, so the gate sees the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      # infra-config is used by pinned commit (infra-config.commit), read through its own qqcfg.
      - name: check out infra-config at the pinned commit
        run: |
          git init -q .qq/infra-config
          git -C .qq/infra-config fetch -q --depth 1 https://github.com/quirq-ai/infra-config "$(cat infra-config.commit)"
          git -C .qq/infra-config checkout -q FETCH_HEAD
          python -m pip install --quiet -r .qq/infra-config/requirements.txt
          python .qq/infra-config/tools/qqcfg.py validate
      - name: "V0-ROL-02: generated Dependabot config matches rollers.toml"
        run: qqroll dependabot --infra-config .qq/infra-config
      - name: no parser of repo.toml outside qqsync (this repo)
        run: qqsync guard .
      - name: "V0-ROL-01: a manifest one promotion behind rolls to exactly the expected bytes"
        run: |
          d=$(mktemp -d)
          cp tests/fixtures/stale.repo.toml "$d/repo.toml"
          qqroll roll --promoted tests/fixtures/promoted.toml --manifest "$d/repo.toml" --infra-config .qq/infra-config
          cmp "$d/repo.toml" tests/fixtures/rolled.repo.toml
          qqroll roll --promoted tests/fixtures/promoted.toml --manifest "$d/repo.toml" | grep -q 'toolchain pins are current'
