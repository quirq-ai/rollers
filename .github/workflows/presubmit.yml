# Hand-written until infra-config generates this repo's presubmit (V0-CFG-02).
# Runs on every PR and in the merge queue, so the gate sees the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Read-only inputs at pinned commits: toolchains for its own promoted.toml parser (qqtc), sync for
  # its manifest fixture. Tests that need them read QQ_TOOLCHAINS and QQ_SYNC.
  TOOLCHAINS_COMMIT: b46e55e196558bcf334c964e2b586e8d110240d6
  SYNC_COMMIT: c51e40205e26771cd88bfc02e0c7522b5ee8271d
  QQ_TOOLCHAINS: .qq/toolchains
  QQ_SYNC: .qq/sync
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - name: check out toolchains and sync at pinned commits
        run: |
          for r in "toolchains $TOOLCHAINS_COMMIT" "sync $SYNC_COMMIT"; do
            set -- $r
            git init -q ".qq/$1"
            git -C ".qq/$1" fetch -q --depth 1 "https://github.com/quirq-ai/$1" "$2"
            git -C ".qq/$1" checkout -q FETCH_HEAD
          done
      - run: python -m pytest -q -p no:cacheprovider -rs
      # infra-config is used by pinned commit (infra-config.commit), read through its own qqcfg.
      - name: check out infra-config at the pinned commit
        run: |
          git init -q .qq/infra-config
          git -C .qq/infra-config fetch -q --depth 1 https://github.com/quirq-ai/infra-config "$(cat infra-config.commit)"
          git -C .qq/infra-config checkout -q FETCH_HEAD
          python -m pip install --quiet -r .qq/infra-config/requirements.txt
          python .qq/infra-config/tools/qqcfg.py validate
      - name: "V0-ROL-02: generated Dependabot config matches rollers.toml"
        run: qqroll dependabot --infra-config .qq/infra-config
      - name: roll-toolchains installs from the hashed lock alone
        run: |
          python -m venv "$RUNNER_TEMP/lock"
          "$RUNNER_TEMP/lock/bin/pip" install --quiet --require-hashes --no-deps -r requirements/roll.lock
          "$RUNNER_TEMP/lock/bin/pip" install --quiet --no-deps --no-build-isolation -r requirements/qqsync.txt
          "$RUNNER_TEMP/lock/bin/pip" install --quiet --no-deps --no-build-isolation .
          "$RUNNER_TEMP/lock/bin/pip" check
          "$RUNNER_TEMP/lock/bin/qqroll" repos --infra-config .qq/infra-config
      - name: no parser of repo.toml outside qqsync (this repo)
        run: qqsync guard .
      - name: "V0-ROL-01: a manifest one promotion behind rolls to exactly the expected bytes"
        run: |
          d=$(mktemp -d)
          cp tests/fixtures/stale.repo.toml "$d/repo.toml"
          qqroll roll --toolchains .qq/toolchains --manifest "$d/repo.toml" --infra-config .qq/infra-config --unverified
          cmp "$d/repo.toml" tests/fixtures/rolled.repo.toml
          qqroll roll --toolchains .qq/toolchains --manifest "$d/repo.toml" | grep -q 'toolchain pins are current'
